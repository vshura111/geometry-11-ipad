<!doctype html>
<html lang="uk">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">

        <div><b>Геометрія</b><span>11 клас · свій темп</span></div>

      <nav class="side-nav" aria-label="Основне меню">

      <button type="button" data-route="home"><span>⌂</span><small>Головна</small></button>
      <button type="button" data-route="topics"><span>▱</span><small>Теми</small></button>
